<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>간호톡톡 | 의학용어 학습 스튜디오</title>
<style>
:root{--navy:#10233f;--blue:#3468d4;--sky:#eaf2ff;--ink:#17243a;--muted:#64748b;--line:#e4eaf2;--bg:#f5f8fc;--white:#fff;--green:#18866b;--red:#c44d55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}header{background:linear-gradient(120deg,#10233f,#244f91);color:white;padding:26px 20px}header .wrap,main{max-width:1050px;margin:auto}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#d7e4fb}main{padding:22px 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 14px #1c355008}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:11px;cursor:pointer;font-weight:650;color:var(--ink)}.tab.active{background:var(--navy);color:white}.panel h2{font-size:19px;margin:0 0 14px}.panel{margin-bottom:14px}.hide{display:none}.btn{border:0;background:var(--blue);color:white;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.btn.secondary{background:#e9eef7;color:var(--ink)}.btn.danger{background:#fff0f0;color:var(--red)}input,select{padding:11px;border:1px solid #d9e2ee;border-radius:10px;font:inherit;max-width:100%;width:100%;background:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.quizbox{background:var(--sky);padding:22px;border-radius:14px}.quizbox .korean{font-size:24px;font-weight:800;margin:8px 0 20px}.answer{display:flex;gap:8px}.answer input{flex:1}.feedback{min-height:25px;font-weight:700;margin:12px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}.term{font-weight:700}.empty{color:var(--muted);padding:15px}.foot{color:var(--muted);font-size:12px;text-align:center;padding:20px}@media(max-width:600px){.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:22px}.grid2{grid-template-columns:1fr}.answer{flex-direction:column}header h1{font-size:22px}}
</style></head>
<body><header><div class="wrap"><h1>🩺 간호톡톡</h1><p>의학용어 학습 스튜디오 · 기억하고, 확인하고, 반복하기</p></div></header>
<main><section class="stats"><div class="stat"><small>등록된 용어</small><strong id="total">0</strong></div><div class="stat"><small>오늘 맞힌 문제</small><strong id="correct">0</strong></div><div class="stat"><small>오답 노트</small><strong id="wrongCount">0</strong></div></section>
<nav class="tabs"><button class="tab active" data-tab="quiz">암기 퀴즈</button><button class="tab" data-tab="terms">용어 목록</button><button class="tab" data-tab="add">용어 추가</button><button class="tab" data-tab="wrong">오답 노트</button></nav>
<section id="quiz" class="panel"><h2>한국어 뜻을 보고 영어 의학용어 맞히기</h2><div class="quizbox"><div id="progress" style="color:#516781;font-size:13px">준비</div><div class="korean" id="question">퀴즈 시작을 눌러주세요.</div><div class="answer"><input id="quizAnswer" placeholder="영어 의학용어 입력" autocomplete="off"><button class="btn" id="check">정답 확인</button></div><div class="feedback" id="feedback"></div><button class="btn secondary" id="next">다음 문제</button><button class="btn secondary" id="start">퀴즈 시작 / 다시 섞기</button></div></section>
<section id="terms" class="panel hide"><h2>용어 목록</h2><input id="search" placeholder="한국어 또는 영어로 검색"><div class="tablewrap"><table><thead><tr><th>한국어</th><th>영어</th><th>분류</th><th>관리</th></tr></thead><tbody id="termRows"></tbody></table></div></section>
<section id="add" class="panel hide"><h2>새 용어 등록</h2><div class="grid2"><div><label class="label">한국어 용어</label><input id="kInput" placeholder="예: 복막염"></div><div><label class="label">영어 용어</label><input id="eInput" placeholder="예: Peritonitis"></div></div><label class="label">분류</label><input id="cInput" placeholder="예: 소화기"><p><button class="btn" id="addBtn">용어 저장</button></p><small>등록한 용어는 이 브라우저에 저장됩니다.</small></section>
<section id="wrong" class="panel hide"><h2>오답 노트</h2><p class="empty" id="wrongEmpty">아직 오답이 없습니다.</p><div class="tablewrap"><table><thead><tr><th>한국어</th><th>영어</th><th>분류</th></tr></thead><tbody id="wrongRows"></tbody></table></div><button class="btn" id="wrongQuiz">오답만 퀴즈</button><button class="btn danger" id="clearWrong">오답 노트 비우기</button></section><div class="foot">간호톡톡 · 학습용 프로그램 · 용어 데이터는 브라우저에 저장됩니다.</div></main>
<script>
const initial=[['복막염','Peritonitis','소화기'],['혈변','Hematochezia','소화기'],['담석증','Cholelithiasis','소화기'],['연하곤란','Dysphagia','소화기'],['변비','Constipation','소화기'],['위식도역류질환','GERD','소화기'],['토혈','Hematemesis','소화기'],['복수','Ascites','소화기'],['결장조루술','Colostomy','소화기'],['내시경 역행 담췌관 조영술','ERCP','소화기'],['간세포암','HCC','소화기'],['저혈량성 쇼크','Hypovolemic shock','응급'],['빈맥','Tachycardia','심혈관'],['서맥','Bradycardia','심혈관'],['호흡곤란','Dyspnea','호흡기'],['폐렴','Pneumonia','호흡기']];let terms=JSON.parse(localStorage.getItem('ntTerms')||'null')||initial.map(([k,e,c])=>({k,e,c}));let wrong=JSON.parse(localStorage.getItem('ntWrong')||'[]');let todays=0,queue=[],idx=0,current=null,onlyWrong=false;
function save(){localStorage.setItem('ntTerms',JSON.stringify(terms));localStorage.setItem('ntWrong',JSON.stringify(wrong));render()}
function render(){document.getElementById('total').textContent=terms.length;document.getElementById('correct').textContent=todays;document.getElementById('wrongCount').textContent=wrong.length;let q=document.getElementById('search').value.toLowerCase();document.getElementById('termRows').innerHTML=terms.filter(t=>(t.k+t.e+t.c).toLowerCase().includes(q)).map(t=>`<tr><td>${esc(t.k)}</td><td class="term">${esc(t.e)}</td><td>${esc(t.c)}</td><td><button class="btn danger" onclick="removeTerm('${encodeURIComponent(t.e)}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">검색 결과가 없습니다.</td></tr>';document.getElementById('wrongRows').innerHTML=wrong.map(t=>`<tr><td>${esc(t.k)}</td><td class="term">${esc(t.e)}</td><td>${esc(t.c)}</td></tr>`).join('');document.getElementById('wrongEmpty').style.display=wrong.length?'none':'block'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function removeTerm(encoded){let e=decodeURIComponent(encoded);terms=terms.filter(t=>t.e!==e);wrong=wrong.filter(t=>t.e!==e);save()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section.panel').forEach(s=>s.classList.add('hide'));document.getElementById(b.dataset.tab).classList.remove('hide')});document.getElementById('search').oninput=render;
document.getElementById('addBtn').onclick=()=>{let k=document.getElementById('kInput').value.trim(),e=document.getElementById('eInput').value.trim(),c=document.getElementById('cInput').value.trim()||'기타';if(!k||!e){alert('한국어와 영어 용어를 모두 입력해 주세요.');return}if(terms.some(t=>t.e.toLowerCase()===e.toLowerCase())){alert('이미 등록된 영어 용어입니다.');return}terms.push({k,e,c});document.getElementById('kInput').value='';document.getElementById('eInput').value='';document.getElementById('cInput').value='';save();alert('용어가 저장되었습니다.')};
function startQuiz(list=terms){if(!list.length){alert('퀴즈에 사용할 용어가 없습니다.');return}queue=[...list].sort(()=>Math.random()-.5);idx=0;showQ()}function showQ(){if(!queue.length){document.getElementById('question').textContent='용어가 없습니다.';return}current=queue[idx%queue.length];document.getElementById('question').textContent=current.k;document.getElementById('progress').textContent=`${idx+1} / ${queue.length}`;document.getElementById('quizAnswer').value='';document.getElementById('feedback').textContent='';document.getElementById('quizAnswer').focus()}
document.getElementById('start').onclick=()=>{onlyWrong=false;startQuiz()};document.getElementById('wrongQuiz').onclick=()=>{onlyWrong=true;startQuiz(wrong)};document.getElementById('next').onclick=()=>{if(!current){startQuiz();return}idx++;showQ()};document.getElementById('check').onclick=check;document.getElementById('quizAnswer').onkeydown=e=>{if(e.key==='Enter')check()};function check(){if(!current){startQuiz();return}let val=document.getElementById('quizAnswer').value.trim().toLowerCase(),target=current.e.toLowerCase(),f=document.getElementById('feedback');if(val===target){f.style.color='var(--green)';f.textContent='정답입니다! ✓';todays++;wrong=wrong.filter(t=>t.e!==current.e);save()}else{f.style.color='var(--red)';f.textContent=`오답! 정답은 ${current.e}`;if(!wrong.some(t=>t.e===current.e))wrong.push(current);save()}}
document.getElementById('clearWrong').onclick=()=>{if(confirm('오답 노트를 비울까요?')){wrong=[];save()}};render();startQuiz();
</script></body></html>
